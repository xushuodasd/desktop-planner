<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- CSP：仅允许自身资源，禁止任何远程内容与内联脚本（REQ-008 / design §4） -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>悬浮工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body class="panel-body">
  <div class="panel" id="panel" data-view="plans">
    <header class="topbar">
      <div class="topbar-main">
        <div class="date-wrap">
          <div class="date-title" id="dateTitle">—</div>
          <div class="date-sub" id="dateSub"></div>
        </div>
      </div>

      <div class="seg" role="tablist" aria-label="视图切换">
        <button type="button" class="seg-btn is-active" id="tabPlans" role="tab" aria-selected="true" data-view="plans">
          待办 <span class="seg-count" id="planCount">0</span>
        </button>
        <button type="button" class="seg-btn" id="tabDones" role="tab" aria-selected="false" data-view="dones">
          已办 <span class="seg-count" id="doneCount">0</span>
        </button>
        <span class="seg-thumb" id="segThumb" aria-hidden="true"></span>
      </div>
    </header>

    <div class="toast" id="toast" hidden></div>

    <div class="stage" id="stage">
      <section class="view view-plans is-active" id="viewPlans" role="tabpanel">
        <div class="empty" id="plansEmpty">还没有待办，在下方添加第一项</div>
        <ul class="list" id="planList"></ul>
      </section>

      <section class="view view-dones" id="viewDones" role="tabpanel" hidden>
        <div class="empty" id="donesEmpty">暂无已办记录</div>
        <ul class="list" id="doneList"></ul>
      </section>
    </div>

    <footer class="dock">
      <div class="composer" id="composer">
        <input type="text" id="timeInput" class="input input-time" placeholder="时间段" maxlength="40" />
        <input type="text" id="textInput" class="input input-text" placeholder="事项，回车添加" maxlength="200" />
      </div>

    </footer>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
