<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'" />
  <title>悬浮工作台</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="ball-root" id="ballRoot" title="悬浮工作台：拖到边缘可吸附，点击开合面板">
    <!-- 苹果风扁平：浅底圆 + 细线对勾（SF Symbol 气质） -->
    <svg class="ball-svg" viewBox="0 0 56 56" aria-label="悬浮工作台">
      <defs>
        <linearGradient id="flatFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#5ac8fa" />
          <stop offset="100%" stop-color="#007aff" />
        </linearGradient>
      </defs>
      <circle cx="28" cy="28" r="24" fill="url(#flatFill)" />
      <circle cx="28" cy="28" r="24" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
      <path d="M17.5 29.2 L24.8 36.2 L39.2 20.8"
            fill="none"
            stroke="#ffffff"
            stroke-width="3.2"
            stroke-linecap="round"
            stroke-linejoin="round" />
    </svg>
  </div>
  <script src="ball.js"></script>
</body>
</html>
